name: SHINO minimal Wi-Fi installer offline
on:
  push:
    branches: [feature/shino-tv-m9-flash-layout-liberation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-install:
    name: Application-only receiver and Windows installer (NO-GO gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Public pinned Core and inert installer tests
        run: |
          python -m pip install 'platformio==6.1.18'
          pio pkg install -g -t 'platformio/framework-arduinoespressif8266@3.30102.0'
          python -m unittest discover -s companion -p test_shino_install.py -v
          python tools/shino_wifi_runner.py > "${{ runner.temp }}/shino-wifi-host.json"
      - name: Two actual public StageA graphs; no receiver activation
        run: |
          python tools/shino_wifi_build.py research-local/shino-install-ci/baseline
          python tools/shino_wifi_build.py research-local/shino-install-ci/integrated --integrated
          pio run -d research-local/shino-install-ci/baseline -e esp12e_m9_4m2m_normal_qualification
          pio run -d research-local/shino-install-ci/integrated -e esp12e_m9_4m2m_normal_qualification
          python tools/shino_wifi_resources.py research-local/shino-install-ci/baseline research-local/shino-install-ci/integrated > "${{ runner.temp }}/shino-wifi-resources.json"
      - name: Exact stop gate and deployed-source preservation
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'companion')
          import shino_install
          assert not shino_install.QUALIFIED_LIVE
          p=Path(os.environ['RUNNER_TEMP'])
          host=json.loads((p/'shino-wifi-host.json').read_text())
          assert host['actual_core'] and host['actual_python_sender'] and host['network_calls']==0
          assert host['interruption_boundaries']==197
          for r in host['rows']:
              assert r['fs_preserved']
              if r['name'] in ('valid_real_sender','time_wrap'):assert r['commit']==1
              else:assert r['commit']==0 and r['running']==0
          resource=json.loads((p/'shino-wifi-resources.json').read_text())
          assert resource['verdict']=='NO_GO' and not resource['activation']
          assert resource['floors']==dict(heap=20480,largest=16384,stack=2048,fragmentation=25)
          assert resource['delta']['noinit']==0
          for k in ('device_contacts','serial_io','flash_writes','rtc_writes','reboots','device_filesystem_writes'):assert resource[k]==0
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: shino-wifi-offline-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/shino-wifi-*.json
          if-no-files-found: error
  offline-maintenance:
    name: Callable StageA maintenance ownership and memory (NO-GO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Actual public callable StageA pair
        run: |
          python -m pip install 'platformio==6.1.18'
          python tools/shino_wifi_build.py research-local/shino-maintenance-ci/baseline
          python tools/shino_maintenance_build.py research-local/shino-maintenance-ci/candidate
          pio run -d research-local/shino-maintenance-ci/baseline -e esp12e_m9_4m2m_normal_qualification
          pio run -d research-local/shino-maintenance-ci/candidate -e esp12e_m9_4m2m_normal_qualification
          python tools/shino_maintenance_resources.py research-local/shino-maintenance-ci/baseline research-local/shino-maintenance-ci/candidate > "${{ runner.temp }}/shino-maintenance-resources.json"
      - name: Actual StageA HTTP lifetime and Native Core faults
        env:
          SHINO_ARDUINOJSON_SRC: ${{ github.workspace }}/research-local/shino-maintenance-ci/candidate/.pio/libdeps/esp12e_m9_4m2m_normal_qualification/ArduinoJson/src
        run: |
          python tools/shino_maintenance_http.py > "${{ runner.temp }}/shino-maintenance-http.json"
          python tools/shino_maintenance_native.py > "${{ runner.temp }}/shino-maintenance-native.json"
      - name: Preserve closed physical gate
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'companion')
          import shino_install
          assert not shino_install.QUALIFIED_LIVE
          p=Path(os.environ['RUNNER_TEMP'])
          r=json.loads((p/'shino-maintenance-resources.json').read_text())
          assert r['verdict']=='NO_GO' and not r['activation'] and not r['trusted_consent_bound']
          assert r['floors']==dict(heap=20480,largest=16384,stack=2048,fragmentation=25)
          h=json.loads((p/'shino-maintenance-http.json').read_text())
          assert h['maintenance_lifecycle']['cycles']==12
          assert h['actual_stage_a_workload']['accepted_post_count']==202
          n=json.loads((p/'shino-maintenance-native.json').read_text())
          assert n['cases']==230 and n['interruption_boundaries']==197 and n['actual_native_pump']
          assert len(n['compile_rejected_interlocks'])==2
          for row in n['rows']:
              assert row['fs_preserved'] and not row['running'] and row['listeners']==row['queued']==0
              assert row['host_restart_calls']==row['commit']
              assert not row['connected']
              if row['name'] not in ('valid_real_sender','time_wrap'):assert row['commit']==0
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: shino-maintenance-offline-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/shino-maintenance-*.json
          if-no-files-found: error

  offline-small-buffer:
    name: Core 256-byte buffer; real StageA graph and interrupted transfer (HOLD)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native Core host failure and interrupted transfer qualification
        run: |
          python -m pip install 'platformio==6.1.18'
          pio pkg install -g -t 'platformio/framework-arduinoespressif8266@3.30102.0'
          python tools/shino_small_buffer_native.py > "${{ runner.temp }}/shino-small-buffer-host.json"
      - name: Compile both real 4m2m public StageA graphs
        run: |
          python tools/shino_wifi_build.py research-local/shino-small-buffer-ci/base
          python -c "import sys;from pathlib import Path;sys.path.insert(0,'tools');from shino_maintenance_build import prepare;prepare(Path('research-local/shino-small-buffer-ci/small'),small_buffer=True)"
          pio run -d research-local/shino-small-buffer-ci/base -e esp12e_m9_4m2m_normal_qualification
          pio run -d research-local/shino-small-buffer-ci/small -e esp12e_m9_4m2m_normal_qualification
          python tools/shino_small_buffer_resources.py research-local/shino-small-buffer-ci/base research-local/shino-small-buffer-ci/small > "${{ runner.temp }}/shino-small-buffer-resources.json"
      - name: Assert data, safety invariants, and no activation
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'companion')
          from shino_install import QUALIFIED_LIVE
          assert not QUALIFIED_LIVE
          p=Path(os.environ['RUNNER_TEMP'])
          h=json.loads((p/'shino-small-buffer-host.json').read_text())
          assert h['cases']==230 and h['interruption_boundaries']==197 and h['actual_core']
          assert h['core_updater_buffer_bytes']==256 and h['network_calls']==0
          r=json.loads((p/'shino-small-buffer-resources.json').read_text())
          assert r['small_core_buffer_bytes']==256
          assert r['scenario_is_not_native_high_water']
          assert r['verdict']=='HOLD_FOR_NATIVE_OBSERVATION'
          assert not r['activation'] and not r['trusted_consent_bound']
          assert r['floors']==dict(heap=20480,largest=16384,stack=2048,fragmentation=25)
          assert r['delta']['noinit']==0
          for key in ('device_contacts','serial_io','flash_writes','rtc_writes','reboots','device_filesystem_writes'):
              assert r[key]==0
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: shino-small-buffer-offline-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/shino-small-buffer-*.json
          if-no-files-found: error
