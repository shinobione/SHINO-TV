name: Mission 9 Phase M bounded ROM sync - OFFLINE only
on:
  push:
    branches: ['feature/shino-tv-m9-flash-layout-liberation']
    paths:
      - 'tools/m9_single_attempt_physical_runner.py'
      - 'tools/test_m9_single_attempt_physical_runner.py'
      - 'tools/test_m9_bounded_rom_sync.py'
      - 'tools/m9_single_attempt_app_write.py'
      - 'tools/test_m9_single_attempt_app_write.py'
      - 'tools/m9_phase_m_qualification.py'
      - 'tools/m9_phase_m_sources.json'
      - 'docs/M09_PHASE_L_SYNC_HOTFIX.md'
      - '.github/workflows/m9-phase-m.yml'
  pull_request:
    paths:
      - 'tools/m9_single_attempt_physical_runner.py'
      - 'tools/test_m9_single_attempt_physical_runner.py'
      - 'tools/test_m9_bounded_rom_sync.py'
      - 'tools/m9_single_attempt_app_write.py'
      - 'tools/test_m9_single_attempt_app_write.py'
      - 'tools/m9_phase_m_qualification.py'
      - 'tools/m9_phase_m_sources.json'
      - 'docs/M09_PHASE_L_SYNC_HOTFIX.md'
      - '.github/workflows/m9-phase-m.yml'
permissions:
  contents: read
jobs:
  phase-m:
    name: Bounded global ROM sync and unchanged K transaction fake serial (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact pinned executor packages
        run: python -m pip install 'esptool==5.4.0' 'esp-pylib==1.1.5' 'pyserial==3.5'
      - uses: actions/checkout@v4
        with:
          repository: espressif/esp-flasher-stub
          ref: 23959b780454adf885916d42f2274ec648e96a94
          path: reference-k-stub
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: espressif/esp-stub-lib
          ref: d61983fa4d1f66b9c088608c1f702ad877121279
          path: reference-k-lib
          persist-credentials: false
      - name: Tests use synthetic evidence and fake serial only
        run: |
          python -m unittest discover -s tools -p 'test_m9_bounded_rom_sync.py' -v
          python -m unittest discover -s tools -p 'test_m9_single_attempt_physical_runner.py' -v
          python -m unittest discover -s tools -p 'test_m9_single_attempt_app_write.py' -v
      - name: Source and version pins; never read/rebuild retained candidate
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'k-stub-audit'
          root.mkdir()
          for source,name in (
              ('reference-k-stub/src/command_handler.c','src-command_handler.c'),
              ('reference-k-stub/src/commands.h','src-commands.h'),
              ('reference-k-stub/src/main.c','src-main.c'),
              ('reference-k-lib/src/flash.c','lib-src-flash.c'),
              ('reference-k-lib/src/target/common/src/flash.c','lib-src-target-common-src-flash.c'),
              ('reference-k-lib/src/target/esp8266/src/flash.c','lib-src-target-esp8266-src-flash.c'),
              ('reference-k-lib/src/target/esp8266/src/rom-patched.c','lib-src-target-esp8266-src-rom-patched.c')):
              shutil.copyfile(source,root/name)
          PY
          python tools/m9_phase_m_qualification.py --stub-audit-root "${{ runner.temp }}/k-stub-audit" > "${{ runner.temp }}/k-executor-source.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          r=json.loads((root/'k-executor-source.json').read_text())
          assert r['PHASE_M_SYNC_ROOT_CAUSE_GATE']==r['PHASE_M_BOUNDED_SYNC_SOURCE_GATE']==r['PHASE_M_RUNNER_REGRESSION_GATE']=='PASS/OFFLINE'
          assert r['PHASE_M_FROZEN_CANDIDATE_IDENTITY_GATE']=='NOT_READ_BY_THIS_RUN'
          assert r['PHASE_L_SINGLE_SYNC_ASSUMPTION']=='REJECTED_BY_PHYSICAL_EVIDENCE'
          assert r['acquisition']=={'max_sync_requests':5,'global_seconds':5,'global_bytes':16384,'global_reads':256,'retry_delay_seconds':0.05,'port_reopens':0,'resets':0}
          assert r['serial_source_audit']['source_files_checked']==28 and not r['serial_source_audit']['electrical_glitch_proof']
          assert r['approved_local_interpreter_identity']=='NOT_READ_BY_THIS_SOURCE_ONLY_RUN'
          assert r['PHASE_K_FROZEN_CANDIDATE_IDENTITY_GATE']=='NOT_READ_BY_THIS_RUN'
          assert r['candidate']['bytes']==411136 and r['candidate']['sha256']=='2ce2fa8da00de5c60109d0675c7bcf58ab41df2138d913b607fde25994e5a835'
          assert r['firmware_files_checked']==103 and r['firmware_files_unchanged']==101
          assert len(r['firmware_mount_stack_changes'])==2 and r['installed_candidate_role']=='HISTORICAL_J_PREDECESSOR_ONLY'
          assert not r['physical_authorization']
          assert all(r[k]==0 for k in ('device_contacts','serial_io','flash_writes','rtc_writes','reboots','device_filesystem_writes'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m9-phase-m-offline-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/k-executor-source.json
          if-no-files-found: error
