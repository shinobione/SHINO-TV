name: LINK M3-M original B5.3 metrics handler native seam (NO DEVICE)
on:
  pull_request:
    paths:
      - 'experiments/link_m3m_native/**'
      - 'docs/LINK_M3M_NATIVE_METRICS.md'
      - 'docs/ROADMAP.md'
      - '.github/workflows/link-m3m-original-metrics-native.yml'
permissions:
  contents: read

jobs:
  real-original-metrics-host:
    name: Actual FslessMetrics.cpp, native handler business parity, no HTTP auth claim
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require exact legacy FirstBootBridge and real FslessMetrics blobs
        run: |
          python -m unittest discover -s experiments/link_m3g_real -p test_exact_source.py -v
          python -m unittest discover -s experiments/link_m3e_legacy -p test_b53_source_pins.py -v
      - name: Fetch true pinned ArduinoJson 7.4.3 to HOST sandbox
        run: |
          python -m pip install 'platformio==6.1.18'
          pio pkg install -d experiments/link_m3g_real -e deps_for_host
      - name: Compile B5.3 real FslessMetrics unchanged and M3-M bounded handler
        run: |
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic \
            -I tools/host_arduinojson_stubs \
            -I firmware/include \
            -I experiments/link_m3m_native \
            -I experiments/link_m3g_real/.pio/libdeps/deps_for_host/ArduinoJson/src \
            experiments/link_m3m_native/test_actual_metrics_handler.cpp \
            firmware/src/boot/FslessMetrics.cpp \
            -o "${{ runner.temp }}/m3m_actual_metrics"
      - name: Assert authorized-only sample update, invalid retains last and TTL
        run: "${{ runner.temp }}/m3m_actual_metrics"
      - name: Guard original HTTP graph not silently renamed as implemented
        run: |
          python - <<'PY'
          from pathlib import Path
          bridge=Path("firmware/src/boot/FirstBootBridge.cpp").read_text()
          seam=Path("experiments/link_m3m_native/M3MActualMetricsHandler.h").read_text()
          native=Path("experiments/link_m3m_native/src/main.cpp").read_text()
          assert 'ESP8266WebServer server(80)' in bridge
          assert 'server.handleClient()' in bridge
          assert 'server.on("/api/v1/bridge/metrics", HTTP_POST, acceptMetrics);' in bridge
          assert 'server.on("/api/v1/bridge/metrics", HTTP_GET, sendMetrics);' in bridge
          assert 'FslessMetrics::apply(' in seam and 'FslessMetrics::describe(' in seam
          assert 'verifier.permit(' in seam
          assert 'volatile bool privateInertProbe=false;' in native
          assert 'volatile bool fakePermit=false;' in native
          assert 'WiFiServer dormantServer(80);' in native
          for forbidden in ('.begin();','WiFi.begin(', 'Update.begin(', 'ESP.restart('):
              assert forbidden not in native
          print("M3M_EXACT_B53_NOT_MIGRATED_SOURCE_GUARD_PASS")
          PY

  native-inert-adapter:
    name: Actual ESP8266 3.1.2 native A/B metrics handler link and code/ram delta
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned PlatformIO
        run: python -m pip install 'platformio==6.1.18'
      - name: Native baseline real M3-L + FslessMetrics
        run: pio run -d experiments/link_m3m_native -e m3m_existing_m3l
      - name: Native same graph plus actual extracted metrics adapter
        run: pio run -d experiments/link_m3m_native -e m3m_with_native_metrics
      - name: Verify unique native adapter retained, derive ELF/BIN/BSS/stack
        run: |
          python experiments/link_m3m_native/report_native_delta.py
          cat experiments/link_m3m_native/m3m_inert_native_handler_receipt.json >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: m3m-inert-native-handler-receipt
          path: experiments/link_m3m_native/m3m_inert_native_handler_receipt.json
          if-no-files-found: error
          retention-days: 7
