name: LINK M2 host preview only

on:
  pull_request:
    paths:
      - 'companion/link_display_modes.py'
      - 'companion/link_mode_tray.py'
      - 'companion/shino_link.py'
      - 'companion/test_link_display_modes.py'
      - 'companion/test_link_mode_tray.py'
      - '.github/workflows/link-m2-host-preview.yml'
      - 'tools/link_m2_source_identity.py'
      - 'tools/test_link_m2_source_identity.py'
      - 'tools/test_m9_b5_offline_source_pins.py'
      - 'tools/m9_signed_ota_runner.py'
      - 'tools/m9_stagea_source_gate.py'
      - 'tools/test_link_m2_win32_smoke.py'

permissions:
  contents: read

jobs:
  local-mode-policy:
    name: LINK M1+M2 pure HOST and fake tray
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile only, no credentials or firmware
        run: python -m compileall -q companion/link_display_modes.py companion/link_mode_tray.py companion/shino_link.py
      - name: Exercise all M1 selection states
        run: python -m unittest discover -s companion -p 'test_link_display_modes.py' -v
      - name: Exercise M2 pystray preview and real run_tray assembly with fakes
        run: python -m unittest discover -s companion -p 'test_link_mode_tray.py' -v
      - name: Prove immutable B5.2 predecessor from reviewed M2 source
        run: python -m unittest discover -s tools -p 'test_link_m2_source_identity.py' -v
      - name: Exercise both retained Mission 9 historical identity gates
        run: python -m unittest discover -s tools -p 'test_m9_b5_offline_source_pins.py' -v

  real-windows-tray:
    name: LINK M2 actual Win32 pystray backend smoke (NO DEVICE)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing LINK tray dependencies only
        run: python -m pip install -r companion/requirements-link.txt
      - name: Import the actual Win32 pystray backend (not fake module)
        run: python -c "import sys, pystray; from PIL import Image; assert sys.platform == 'win32' and pystray.Icon.HAS_MENU and pystray.Icon.HAS_MENU_RADIO; print('WIN32_BACKEND_IMPORT_PASS')"
      - name: Run M1 / M2 / LINK regressions without a network sender
        run: |
          python -m unittest discover -s companion -p 'test_link_display_modes.py' -v
          python -m unittest discover -s companion -p 'test_link_mode_tray.py' -v
          python -m unittest discover -s companion -p 'test_shino_link.py' -v
      - name: Exercise real Win32 menu callbacks and bounded icon lifecycle
        run: python -m unittest discover -s tools -p 'test_link_m2_win32_smoke.py' -v
      - name: Inspect per-user startup status read only
        run: python companion/shino_link.py --autostart status
