name: MUSIC follow source review
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'review/music_follow/**'
      - '.github/workflows/music-follow-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-host:
    name: Focused HOST (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HOST image dependency
        run: python -m pip install Pillow==12.3.0
      - name: Focused offline regression suite
        run: python -B -m unittest discover -s review/music_follow/tests -p "test_*.py" -v
