name: Single-device Wi-Fi path — OFFLINE preflight only

on:
  push:
    branches: ['safety/**', 'feature/**', 'security/**']
    paths:
      - 'tools/wifi_flash_preflight.py'
      - 'tools/test_wifi_flash_preflight.py'
      - 'tools/generate_shino_device_policy.py'
      - '.github/workflows/wifi-path-preflight.yml'
      - 'firmware/**'
      - 'recovery_loader/**'
      - 'recovery/**'
  pull_request:
    paths:
      - 'tools/wifi_flash_preflight.py'
      - 'tools/test_wifi_flash_preflight.py'
      - 'tools/generate_shino_device_policy.py'
      - '.github/workflows/wifi-path-preflight.yml'
      - 'firmware/**'
      - 'recovery_loader/**'
      - 'recovery/**'

permissions:
  contents: read

jobs:
  offline-path:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out SHINO
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch manufacturer at immutable historical commit
        uses: actions/checkout@v4
        with:
          repository: GeekMagicClock/smalltv-ultra
          ref: 55d7877fcba8b1cb7a66a0830d35d5b374bc8540
          path: reference-geekmagic
          persist-credentials: false
          sparse-checkout: |
            Ultra-V9.0.44
      - name: Python toolchain
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests (synthetic images only)
        run: python -m unittest discover -s tools -p 'test_wifi_flash_preflight.py' -v
      - name: Verify exact OEM Git object, ZIP and inner image
        run: |
          test "$(git -C reference-geekmagic rev-parse HEAD)" = "55d7877fcba8b1cb7a66a0830d35d5b374bc8540"
          test "$(git -C reference-geekmagic rev-parse HEAD:Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip)" = "a829d48766cbd2f4f62656523cc9646ba67017d3"
          python tools/verify_factory_ota.py --manifest recovery/factory_ota_v9_0_44.json reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip
      - name: Install PlatformIO and esptool (no serial operations)
        run: python -m pip install 'platformio>=6.1,<7' 'esptool>=5,<6'
      - name: Generate throwaway BLANK source config, never owner credentials
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('firmware/data/config.json')
          assert not p.exists()
          p.write_text(json.dumps({'wifi_ssid':'','wifi_password':'','api_token':'','lcd_rotation':0})+'\n')
          PY
      - name: Build exact LittleFS image offline, NEVER provision on a device
        working-directory: firmware
        run: pio run -e esp12e -t buildfs
      - name: Inspect source/image and keep ephemeral exact copy
        run: |
          python tools/verify_fs_provisioning.py --image firmware/.pio/build/esp12e/littlefs.bin --source-root firmware/data --platformio firmware/platformio.ini > /tmp/shino-fs-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/shino-fs-preflight.json').read_text())
          assert result['image_bytes']==2072576
          assert result['non_atomic_esp8266_U_FS_writes_active_FS_in_place'] is True
          assert result['owner_FS_migration_permission'] is False
          assert result['first_boot_migration_writer_compiled'] is False
          print('Offline FS pin:',result['image_sha256'],'(NOT a firmware upload)')
          PY
          cp firmware/.pio/build/esp12e/littlefs.bin /tmp/shino-exact-fs.bin
      - name: Generate ephemeral experimental OEM app return + READ-ONLY FS policy
        run: |
          python tools/generate_shino_device_policy.py \
            --oem-zip reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip \
            --fs-image /tmp/shino-exact-fs.bin \
            --enable-restore
          grep -q '^#define SHINO_ENABLE_FACTORY_RESTORE 1$' firmware/include/shino_private_policy.h
          grep -q '^#define SHINO_ENABLE_FS_MIGRATION 0$' firmware/include/shino_private_policy.h
          grep -q '^#define SHINO_FS_BYTES 2072576$' firmware/include/shino_private_policy.h
          grep -q '^#define SHINO_BOOT_PROFILE 0$' firmware/include/shino_private_policy.h
      - name: Compile actual experimental SHINO candidate (no upload)
        working-directory: firmware
        run: pio run -e esp12e
      - name: Verify current SHINO output, never publish
        run: |
          test -s firmware/.pio/build/esp12e/firmware.bin
          cp firmware/.pio/build/esp12e/firmware.bin /tmp/shino-preflight-candidate.bin
      - name: Generate a loader pinned to this exact SHINO candidate and OEM
        run: |
          python tools/make_loader_policy.py --official-zip reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip --candidate-bin /tmp/shino-preflight-candidate.bin --enable-writes
      - name: Compile exact candidate-locked loader (no upload)
        working-directory: recovery_loader
        run: pio run -e esp12e_recovery
      - name: Verify loader output, never publish
        run: |
          test -s recovery_loader/.pio/build/esp12e_recovery/firmware.bin
          cp recovery_loader/.pio/build/esp12e_recovery/firmware.bin /tmp/shino-preflight-loader.bin
      - name: Independently inspect both builds and the original ESP8266 image
        run: |
          python -m esptool image-info /tmp/shino-preflight-loader.bin
          python -m esptool image-info /tmp/shino-preflight-candidate.bin
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip') as z:
              Path('/tmp/shino-preflight-original.bin').write_bytes(z.read('FW-Smalltv-Ultra-V9.0.44.bin'))
          PY
          python -m esptool image-info /tmp/shino-preflight-original.bin
      - name: Check complete three-image compatibility assumptions OFFLINE
        run: |
          python tools/wifi_flash_preflight.py \
            --official-zip reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip \
            --manifest recovery/factory_ota_v9_0_44.json \
            --loader /tmp/shino-preflight-loader.bin \
            --candidate /tmp/shino-preflight-candidate.bin \
            --loader-ini recovery_loader/platformio.ini \
            --candidate-ini firmware/platformio.ini > /tmp/shino-preflight-result.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('/tmp/shino-preflight-result.json').read_text())
          assert d['status']=='OFFLINE_PREFLIGHT_ONLY__OWNER_FLASH_NOT_AUTHORIZED'
          assert d['permission_to_flash'] is False
          assert d['device_access_performed'] is False
          assert b'FIRST_BOOT_BRIDGE' in Path('/tmp/shino-preflight-candidate.bin').read_bytes()
          assert b'READ_ONLY_FS_MIGRATION_PLAN' in Path('/tmp/shino-preflight-candidate.bin').read_bytes()
          print('PASS: exactly pinned OEM, actual compiled SHINO + its own OEM rollback, candidate-locked loader.')
          print('Original stock OTA acceptance, OEM filesystem and nonbooting Wi-Fi recovery remain unknown.')
          for image in d['images']:
              print(f"IMAGE {image['name']}: {image['size_bytes']} bytes; {image['flash_mode']}; {image['flash_size_flag']}; {image['flash_frequency']}")
          lines=['### Three-image offline preflight', '', '| Check | Result |', '|---|---|']
          lines += [
              '| OEM original archive + image | Exact hash PASS |',
              '| Current SHINO firmware + its own OEM pin | PASS |',
              '| First-hop loader exact candidate + OEM pins | PASS |',
              '| Nominal loader -> SHINO staging | '+str(d['transitions']['loader_to_shino']['nominal_no_overlap'])+' |',
              '| Nominal SHINO -> OEM staging | '+str(d['transitions']['shino_to_factory']['nominal_no_overlap'])+' |',
              '| Actual owner stock OTA slot and acceptance | UNKNOWN |',
              '| Original OEM filesystem map | UNKNOWN |',
              '| Nonbooting Wi-Fi recovery | NOT GUARANTEED |',
              '', '**No physical device access and NO permission to flash.**'
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n'.join(lines)+'\n')
          PY
      - name: Delete proprietary OEM checkout, all generated secrets and binaries
        if: always()
        run: |
          rm -rf reference-geekmagic recovery_loader/private recovery_loader/.pio firmware/.pio firmware/private
          rm -f recovery_loader/include/local_policy.h firmware/data/config.json firmware/include/shino_private_policy.h
          rm -f /tmp/shino-preflight-candidate.bin /tmp/shino-preflight-loader.bin /tmp/shino-preflight-original.bin /tmp/shino-preflight-result.json /tmp/shino-exact-fs.bin /tmp/shino-fs-preflight.json
