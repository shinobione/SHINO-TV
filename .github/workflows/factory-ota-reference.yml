name: Inspect historical official Ultra-V9.0.44 OTA (metadata only)

on:
  push:
    branches: ['safety/**', 'feature/**']
    paths:
      - '.github/workflows/factory-ota-reference.yml'
      - 'tools/verify_factory_ota.py'
      - 'tools/test_verify_factory_ota.py'
      - 'recovery/**'
  pull_request:
    paths:
      - '.github/workflows/factory-ota-reference.yml'
      - 'tools/verify_factory_ota.py'
      - 'tools/test_verify_factory_ota.py'
      - 'recovery/**'

permissions:
  contents: read

jobs:
  verify-factory-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the pinned historical manufacturer commit
        uses: actions/checkout@v4
        with:
          repository: GeekMagicClock/smalltv-ultra
          ref: 55d7877fcba8b1cb7a66a0830d35d5b374bc8540
          path: reference-geekmagic
          persist-credentials: false
          sparse-checkout: |
            Ultra-V9.0.44
      - name: Verify exact source commit and pinned archive integrity
        run: |
          test "$(git -C reference-geekmagic rev-parse HEAD)" = "55d7877fcba8b1cb7a66a0830d35d5b374bc8540"
          test "$(git -C reference-geekmagic rev-parse HEAD:Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip)" = "a829d48766cbd2f4f62656523cc9646ba67017d3"
          python tools/verify_factory_ota.py --manifest recovery/factory_ota_v9_0_44.json reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip
      - name: Unit tests (synthetic archives only)
        run: python -m unittest discover -s tools -p 'test_verify_factory_ota.py' -v
      - name: Do not publish or install manufacturer binary
        run: |
          echo 'Factory OTA was inspected in the ephemeral CI runner only.'
          echo 'No upload, device connection, release artifact or binary redistribution performed.'
