name: Public source review HOST
on:
  push:
    branches: [codex/public-p0-512-b54-review]
  pull_request:
    paths: ["review/**", ".github/workflows/public-source-review.yml"]
permissions:
  contents: read
jobs:
  host-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Source integrity and complete HOST regression
        run: python3 -B review/run_tests.py
