name: Firmware baseline build (no device flash)

on:
  push:
    branches: [main, 'planning/**', 'feature/**', 'safety/**', 'security/**']
    paths:
      - 'firmware/**'
      - 'recovery/**'
      - 'tools/verify_factory_ota.py'
      - 'tools/generate_shino_device_policy.py'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'recovery/**'
      - 'tools/verify_factory_ota.py'
      - 'tools/generate_shino_device_policy.py'
      - '.github/workflows/firmware-build.yml'

concurrency:
  # Separate push and PR groups: a branch push cannot cancel a required PR check.
  # Manual runs have their own group and cannot be cancelled by new commits.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  compile-esp8266:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out SHINO (no persisted GitHub token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch immutable official OEM application OTA reference
        uses: actions/checkout@v4
        with:
          repository: GeekMagicClock/smalltv-ultra
          ref: 55d7877fcba8b1cb7a66a0830d35d5b374bc8540
          path: reference-geekmagic
          persist-credentials: false
          sparse-checkout: |
            Ultra-V9.0.44
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify manufacturer commit, blob, ZIP and inner BIN SHA-256
        run: |
          test "$(git -C reference-geekmagic rev-parse HEAD)" = "55d7877fcba8b1cb7a66a0830d35d5b374bc8540"
          test "$(git -C reference-geekmagic rev-parse HEAD:Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip)" = "a829d48766cbd2f4f62656523cc9646ba67017d3"
          python tools/verify_factory_ota.py --manifest recovery/factory_ota_v9_0_44.json reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip
      - name: Generate private OEM reference and FS-LESS read-only bridge policy
        run: |
          python tools/generate_shino_device_policy.py --oem-zip reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip
          grep -q '^#define SHINO_ENABLE_FACTORY_RESTORE 0$' firmware/include/shino_private_policy.h
          grep -q '^#define SHINO_BOOT_PROFILE 0$' firmware/include/shino_private_policy.h
          grep -q '^#define SHINO_ENABLE_FS_MIGRATION 0$' firmware/include/shino_private_policy.h
          grep -q '^#define SHINO_FS_IMAGE_PRESENT 0$' firmware/include/shino_private_policy.h
          test ! -f firmware/data/config.json
      - name: Enforce stock-like 4m3m OTA boundary; no filesystem mount/provisioning
        run: |
          grep -q '^board_build.ldscript = eagle.flash.4m3m.ld$' firmware/platformio.ini
          grep -q '^#define SHINO_FS_IMAGE_PRESENT 0$' firmware/include/shino_private_policy.h
          grep -q '^#define SHINO_ENABLE_FS_MIGRATION 0$' firmware/include/shino_private_policy.h
          test ! -f firmware/data/config.json
      - name: Install PlatformIO
        run: python -m pip install 'platformio>=6.1,<7'
      - name: Compile autonomous flash-embedded LCD + Web UI and RAM telemetry
        working-directory: firmware
        run: pio run -e esp12e
      - name: Compare REAL pinned ArduinoJson with unchanged FslessMetrics.cpp on host (NO DEVICE)
        run: |
          test -f firmware/.pio/libdeps/esp12e/ArduinoJson/src/ArduinoJson/version.hpp
          python tools/verify_native_arduinojson_parity.py
      - name: Enforce actual no-FS candidate size and source/flash markers
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('firmware/.pio/build/esp12e/firmware.bin')
          assert p.is_file() and p.stat().st_size > 0, 'No application image compiled'
          blob=p.read_bytes()
          for marker in (b'FIRST_BOOT_BRIDGE',b'FSLESS_PC_TELEMETRY_RAM_ONLY',
                         b'READ_ONLY_FS_MIGRATION_PLAN',b'RAM_SAMPLE_ACCEPTED'):
              assert marker in blob, f'Missing fsless bridge marker: {marker!r}'
          assert b'OBSERVED_HEAP_V1' not in blob, 'Default firmware must not contain opt-in diagnostics'
          assert p.stat().st_size < 494144, 'Current candidate is not smaller than OEM app; manually review OTA geometry'
          assert not (Path('firmware/.pio/build/esp12e')/'littlefs.bin').exists(), 'FS image must not be built for this profile'
          print('Conservative RAM-only SHINO image:',p.stat().st_size,'bytes. No FS generated, no device upload.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('### SHINO native FS-less build — offline only\n\n'
                        f'Application image: {p.stat().st_size:,} bytes. No LittleFS image generated. '
                        'Factory restoration POST not compiled. Owner device untouched.\n')
          PY
      - name: Compile explicit READ-ONLY instrumented heap candidate (NO UPLOAD)
        working-directory: firmware
        run: pio run -e esp12e_heap_diagnostics
      - name: Verify optional heap candidate markers, bounds and no FS image
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('firmware/.pio/build/esp12e_heap_diagnostics/firmware.bin')
          assert p.is_file() and 0 < p.stat().st_size < 494144, 'Heap candidate requires manual size/OTA review'
          blob=p.read_bytes()
          for marker in (b'FIRST_BOOT_BRIDGE', b'OBSERVED_HEAP_V1',
                         b'lowest_observed_free_heap_bytes', b'RAM_SAMPLE_ACCEPTED'):
              assert marker in blob, f'Opt-in read-only image missing marker: {marker!r}'
          assert not (p.parent/'littlefs.bin').exists(), 'Opt-in candidate must not contain FS image'
          print('Optional heap diagnostic candidate COMPILED ONLY:',p.stat().st_size,'bytes. NEVER uploaded.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('### Separately gated heap diagnostic candidate — OFFLINE ONLY\\n\\n'
                        f'Opt-in instrumented image: {p.stat().st_size:,} bytes. '
                        'Default V2 build is uninstrumented; NO DEVICE UPLOAD.\\n')
          PY
      - name: Rebuild exact OEM-return plus HEAP candidate with disposable private policy (NO UPLOAD)
        run: |
          # Ephemeral test credentials only. Remove earlier test policy rather
          # than overwriting it. No release/download artifact is produced.
          rm -f firmware/include/shino_private_policy.h firmware/private/credentials.txt
          python tools/generate_shino_device_policy.py --oem-zip reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip --enable-restore >/dev/null
          grep -q '^#define SHINO_ENABLE_FACTORY_RESTORE 1$' firmware/include/shino_private_policy.h
          grep -q '^#define SHINO_ENABLE_NATIVE_SIGNED_OTA 0$' firmware/include/shino_private_policy.h
          cd firmware
          pio run -e esp12e_heap_diagnostics
      - name: Verify combined REAL ESP8266 heap and pinned OEM return compilation offline
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, os
          binfile=Path('firmware/.pio/build/esp12e_heap_diagnostics/firmware.bin')
          assert binfile.is_file() and 0 < binfile.stat().st_size < 494144
          image=binfile.read_bytes()
          with zipfile.ZipFile('reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip') as z:
              oem=z.read('FW-Smalltv-Ultra-V9.0.44.bin')
          pinned_md5=hashlib.md5(oem,usedforsecurity=False).hexdigest().encode()
          for marker in (b'FIRST_BOOT_BRIDGE',b'OBSERVED_HEAP_V1',
                         b'lowest_observed_free_heap_bytes',
                         b'Verified OEM application image',pinned_md5):
              assert marker in image, f'Missing opt-in/OEM marker: {marker!r}'
          assert not (binfile.parent/'littlefs.bin').exists()
          print('Real combined OEM-return + HEAP candidate COMPILED ONLY:',binfile.stat().st_size,'bytes. No upload.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('Combined owner-like OEM-only return + observed HEAP profile: '
                        f'{binfile.stat().st_size:,} bytes, disposable CI policy, no device contacted or uploaded.\\n')
          PY
      - name: Delete proprietary manufacturer source, one-use keys and images
        if: always()
        run: |
          rm -f firmware/include/shino_private_policy.h
          rm -rf firmware/private firmware/.pio reference-geekmagic
