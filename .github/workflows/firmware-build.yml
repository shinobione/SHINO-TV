name: Firmware baseline build (no device flash)

on:
  push:
    branches: [main, 'planning/**', 'feature/**', 'safety/**', 'security/**']
    paths:
      - 'firmware/**'
      - 'recovery/**'
      - 'tools/verify_factory_ota.py'
      - 'tools/generate_shino_device_policy.py'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'recovery/**'
      - 'tools/verify_factory_ota.py'
      - 'tools/generate_shino_device_policy.py'
      - '.github/workflows/firmware-build.yml'

permissions:
  contents: read

jobs:
  compile-esp8266:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out SHINO
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact historical official OTA source
        uses: actions/checkout@v4
        with:
          repository: GeekMagicClock/smalltv-ultra
          ref: 55d7877fcba8b1cb7a66a0830d35d5b374bc8540
          path: reference-geekmagic
          persist-credentials: false
          sparse-checkout: |
            Ultra-V9.0.44
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify manufacturer commit, blob and pinned SHA-256
        run: |
          test "$(git -C reference-geekmagic rev-parse HEAD)" = "55d7877fcba8b1cb7a66a0830d35d5b374bc8540"
          test "$(git -C reference-geekmagic rev-parse HEAD:Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip)" = "a829d48766cbd2f4f62656523cc9646ba67017d3"
          python tools/verify_factory_ota.py --manifest recovery/factory_ota_v9_0_44.json reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip
      - name: Generate one-use private device policy — restore writes disabled
        run: |
          python tools/generate_shino_device_policy.py --oem-zip reference-geekmagic/Ultra-V9.0.44/FW-Smalltv-Ultra-V9.0.44.zip
          grep -q '^#define SHINO_ENABLE_FACTORY_RESTORE 0$' firmware/include/shino_private_policy.h
      - name: Create blank disposable configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('firmware/data/config.json')
          assert not p.exists()
          p.write_text(json.dumps({'wifi_ssid':'','wifi_password':'','api_token':'','lcd_rotation':0}) + '\n')
          PY
      - name: Install PlatformIO
        run: python -m pip install 'platformio>=6.1,<7'
      - name: Compile read-only candidate and verify BIN immediately, never upload
        working-directory: firmware
        run: |
          pio run -e esp12e
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('.pio/build/esp12e/firmware.bin')
          assert p.is_file() and p.stat().st_size>0, f'Compiler produced no firmware BIN at {p}'
          print('Offline read-only candidate:',p.stat().st_size,'bytes')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('Offline read-only application: '+str(p.stat().st_size)+' bytes; no upload.\n')
          PY
      - name: Build filesystem, never upload
        working-directory: firmware
        run: pio run -e esp12e -t buildfs
      - name: Confirm both images built; report metadata only
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          base=Path('firmware/.pio/build/esp12e')
          filesystem=base/'littlefs.bin'
          assert filesystem.is_file() and filesystem.stat().st_size>0, f'Missing/empty LittleFS: {filesystem}'
          lines=['### Firmware baseline: offline-only PASS', '', '| Output | Size (bytes) |', '|---|---:|']
          lines += [f'| littlefs.bin | {filesystem.stat().st_size:,} |']
          lines += ['', 'Factory return POST NOT compiled. No physical validation or flash permission.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          print('Source and LittleFS builds passed. No output binary published.')
          PY
      - name: Delete OEM checkout, private credentials, generated bins
        if: always()
        run: |
          rm -f firmware/data/config.json firmware/include/shino_private_policy.h
          rm -rf firmware/private firmware/.pio reference-geekmagic
