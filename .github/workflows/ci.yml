name: Offline audit and simulator tests

on:
  push:
    branches: [main, 'planning/**', 'feature/**', 'safety/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch independently pinned ArduinoJson 7.4.3 source for HOST comparison
        uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: 77771d3c07668e01d8f52acb03910c1110bb373f
          path: reference-arduinojson
          persist-credentials: false
      - name: Verify original FslessMetrics.cpp using REAL ArduinoJson on host (NO DEVICE)
        env:
          SHINO_ARDUINOJSON_SRC: reference-arduinojson/src
        run: |
          test "$(git -C reference-arduinojson rev-parse HEAD)" = "77771d3c07668e01d8f52acb03910c1110bb373f"
          python tools/verify_native_arduinojson_parity.py
      - name: Test static firmware inspector
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Test Windows telemetry bridge and bounded V0.5 host-only media emulation (no device)
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s companion -p 'test_*.py' -v
      - name: Test 240x240 scene renderer and isolated NOW PLAYING V0.3 preview
        run: node --test simulator/scene.test.mjs simulator/now_playing.test.mjs
      - name: Exercise exact PROGMEM UI V2 math and browser four-card states
        run: node --test tools/test_native_ui_v2.cjs
      - name: Check JS syntax (existing scene + V0.3 preview)
        run: |
          node --check simulator/scene.mjs
          node --check simulator/now_playing.mjs
          node --check simulator/now-playing-live.mjs

  shino-link-windows-smoke:
    name: SHINO LINK Windows-only smoke (PC, no device)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise PC-only companion, config and tray imports (no network/device)
        run: |
          python -m pip install -r companion/requirements-link.txt
          python -m compileall -q companion/shino_link.py
          python -m unittest discover -s companion -p 'test_shino_link.py' -v
          python -c "import pystray; from PIL import Image; print('Windows tray imports OK')"
          python companion/shino_link.py --autostart status
      - name: Media session projection imports and mock PC-only probe (no live session/TV)
        run: |
          python -m pip install -r companion/requirements-media.txt
          python -m compileall -q companion/media_sessions.py
          python -m unittest discover -s companion -p 'test_media_sessions.py' -v
          python -m compileall -q companion/media_preview_server.py
          python -m unittest discover -s companion -p 'test_media_preview_server.py' -v
          python -m compileall -q companion/media_wire_v1.py
          python -m unittest discover -s companion -p 'test_media_wire_v1.py' -v
          python -m unittest discover -s tools -p 'test_media_v06_frozen_source_gate.py' -v
          python -m unittest discover -s companion -p 'test_media_v06_resource_stress.py' -v
          python -c "import winrt.windows.foundation; import winrt.windows.foundation.collections; import winrt.windows.media.control; import winrt.windows.storage.streams; print('All 4 WinRT projections OK')"
          python companion/media_sessions.py --demo
          python companion/media_sessions.py --probe
