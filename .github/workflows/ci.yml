name: Offline audit and simulator tests

on:
  push:
    branches: [main, 'planning/**', 'feature/**', 'safety/**', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  home-lan:
    name: P1 persistent SDK Wi-Fi and LAN boundaries (offline only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned build orchestrator
        run: python -m pip install 'platformio==6.1.18' 'Pillow>=10,<13'
      - name: Compile matched P0, P1 and exact-OEM-enabled guarded graphs
        run: pio run -d experiments/home_lan -e p0_compile -e p1_compile -e p1_oem_compile
      - name: Shared persistence/reconnect model and native HTTP handlers
        run: |
          python tools/home_lan_runner.py > "${{ runner.temp }}/p1-host.json"
          python tools/home_lan_http_runner.py > "${{ runner.temp }}/p1-http.json"
          SHINO_ARDUINOJSON_SRC=experiments/home_lan/.pio/libdeps/p1_compile/ArduinoJson/src SHINO_GFX_SRC="experiments/home_lan/.pio/libdeps/p1_compile/GFX Library for Arduino/src" python tools/home_lan_media_runner.py > "${{ runner.temp }}/p1-media.json"
          python tools/home_lan_resources.py > "${{ runner.temp }}/p1-resources.json"
          python -m unittest discover -s companion -p 'test_provision_home_wifi.py' -v
          python -m unittest discover -s companion -p 'test_shino_link.py' -v
          python -m unittest discover -s tools -p 'test_home_lan_owner_packet.py' -v
          python -c 'import json,os; p=os.environ["RUNNER_TEMP"]; h=json.load(open(p+"/p1-host.json")); w=json.load(open(p+"/p1-http.json")); r=json.load(open(p+"/p1-resources.json")); m=json.load(open(p+"/p1-media.json")); assert h["checks"]>=183 and w["checks"]>=34 and h["failed"]==w["failed"]==0; assert all(x["cases_passed"]>=33 and x["render_heap_allocations"]==0 and x["sanitizers"]=="ASan + UBSan" for x in m["runs"]); assert h["device_contacts"]==w["device_contacts"]==r["device_contacts"]==m["device_contacts"]==0 and h["device_writes"]==w["device_writes"]==r["device_writes"]==m["device_writes"]==0'
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: p1-offline-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-*.json
          if-no-files-found: error
  artwork-pilot:
    name: V2.2 native scenes, clipped marquee and linked resources (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Freeze completed P0 graph/resource assertions; P1 builds its own pair.
          ref: a3d9fdb4fc1fe1eb1b49837551e0610c9ca88e5d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned offline compiler and host preview dependency
        run: python -m pip install 'platformio==6.1.18' 'Pillow>=10,<13'
      - name: Link previous PR40 and both scene scaling options, all unstarted
        run: pio run -d experiments/artwork_pilot -e baseline_compile -e previous_pilot_compile -e scene128_compile -e pilot_compile
      - name: Real native authentication/receiver and software LCD under ASan/UBSan
        run: |
          python tools/artwork_pilot_runner.py --previews "${{ runner.temp }}/artwork-previews" > "${{ runner.temp }}/artwork-host.json"
          python tools/artwork_pilot_runner.py --scale 4 --previews "${{ runner.temp }}/artwork-128-previews" > "${{ runner.temp }}/artwork-128-host.json"
          python tools/artwork_pilot_resources.py --host-report "${{ runner.temp }}/artwork-host.json" > "${{ runner.temp }}/artwork-resources.json"
          python -c 'import json,os; p=os.environ["RUNNER_TEMP"]; h=json.load(open(p+"/artwork-host.json")); s=json.load(open(p+"/artwork-128-host.json")); r=json.load(open(p+"/artwork-resources.json")); assert min(h["cases_passed"],s["cases_passed"])>=33 and h["render_heap_allocations"]==s["render_heap_allocations"]==0 and h["sanitizers"]==s["sanitizers"]=="ASan + UBSan"; assert r["delta"]["persistent_DRAM_bytes"]<2048 and not r["full_240_framebuffer_native"]; assert h["individual_preview_size"]==s["individual_preview_size"]==[240,240]; assert h["device_contacts"]==h["device_writes"]==r["device_contacts"]==r["device_writes"]==0'
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: artwork-offline-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/artwork-*.json
            ${{ runner.temp }}/artwork-previews
            ${{ runner.temp }}/artwork-128-previews
          if-no-files-found: error
  v08-m8r-stack-remediation:
    name: V0.8 Mission 8R focused regressions and linked StackThunk isolation (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Freeze completed Mission 8 evidence; pilot tests exercise the new head.
          ref: 9fce7137f9fadd83678887442bf91cf60ea86b2e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local compiler and retained fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib
          python -m pip install 'platformio==6.1.18'
          npm ci --prefix experiments/v08_protocol --ignore-scripts --no-audit --no-fund
      - name: Link guarded full graphs with the unmodified pinned m31 source
        run: pio run -d experiments/v08_m8r -e legacy_compile -e media_compile -e stack_sensitivity_compile
      - name: Regress real crypto, split-phase security and retained owner behavior
        env:
          SHINO_ARDUINOJSON_SRC: experiments/v08_m8r/.pio/libdeps/media_compile/ArduinoJson/src
          EXPECTED_HEAD: 9fce7137f9fadd83678887442bf91cf60ea86b2e
        run: |
          python tools/v08_m8r_runner.py > "${{ runner.temp }}/v08-m8r-focused.json"
          python tools/v08_m8r_metadata_runner.py > "${{ runner.temp }}/v08-m8r-metadata32.json"
          python tools/v08_m8r_transfer_plan.py > "${{ runner.temp }}/v08-m8r-timing.json"
          python tools/v08_m8r_control.py > "${{ runner.temp }}/v08-m8r-controller.json"
          python tools/v08_m8r_stack.py > "${{ runner.temp }}/v08-m8r-stack.json"
          python tools/v08_m8r_stack.py --environment stack_sensitivity_compile > "${{ runner.temp }}/v08-m8r-sensitivity.json"
          python -c 'import json,os; h=json.load(open(os.environ["RUNNER_TEMP"]+"/v08-m8r-focused.json")); s=json.load(open(os.environ["RUNNER_TEMP"]+"/v08-m8r-stack.json")); assert h["head"]==s["head_at_analysis"]==os.environ["EXPECTED_HEAD"] and not h["dirty"] and not s["dirty"]; assert len(h["runs"])==2 and all(x["result"]["failed"]==0 and x["result"]["live_descriptors"]==0 for x in h["runs"]); assert h["wire_differential"]["agreement"] and h["profile_differential"]["agreement"]; assert s["known_crypto_chain_lower_bound_bytes"]==2224 and s["cont_stack_bytes"]==4096; assert s["gate"]=="PASS__STACK_ISOLATION_READY_FOR_CONTROLLED_PHYSICAL_MEASUREMENT" and s["opaque_targets"]["0x4000dcf0"]=="__umulsidi3" and s["device_contacts"]==s["device_writes"]==0'
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: v08-m8r-frozen-evidence-9fce7137f9fadd83678887442bf91cf60ea86b2e
          path: ${{ runner.temp }}/v08-m8r-*.json
          if-no-files-found: error
  v08-m8-preinstall-stack-gate:
    name: V0.8 Mission 8 static stop evidence (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Mission 8 enforces its own allowed diff; preserve its exact head.
          ref: 5179eb04ea51c2a92c7f796f07ebb963e2167e00
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned offline compiler
        run: python -m pip install 'platformio==6.1.18'
      - name: Reproduce unchanged guarded Mission 7 graphs and linked stack blocker
        env:
          EXPECTED_HEAD: 5179eb04ea51c2a92c7f796f07ebb963e2167e00
        run: |
          pio run -d experiments/v08_m7 -e legacy_compile -e media_compile
          python tools/v08_m8_stack_gate.py > "${{ runner.temp }}/v08-m8-stack.json"
          python -m compileall -q tools/v08_m8_preflight.py tools/v08_m8_stack_gate.py
          python -c 'import json,os,subprocess; r=json.load(open(os.environ["RUNNER_TEMP"]+"/v08-m8-stack.json")); assert r["head_at_analysis"]==os.environ["EXPECTED_HEAD"]; assert r["crypto_path_lower_bound_bytes"]==4384 and r["receiver_and_crypto_path_lower_bound_bytes"]==5904 and r["cont_stack_bytes"]==4096; assert r["device_writes"]==0 and not r["instrumented_mission8_candidate_built"]; paths=subprocess.check_output(["git","diff","--name-only",r["source_parent"],"HEAD"],text=True).splitlines(); assert all(p==".github/workflows/ci.yml" or p.startswith(("tools/v08_m8_","docs/V08_MISSION_8_")) for p in paths),paths'
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: v08-m8-static-stop-historical-5179eb04ea51c2a92c7f796f07ebb963e2167e00
          path: ${{ runner.temp }}/v08-m8-stack.json
          if-no-files-found: error
  v08-m7-native-receiver:
    name: V0.8 Mission 7 offline native receiver and full static links (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve Mission 7's own allowed-diff/current-head lab at its exact head.
          ref: 84129daa7359c73e738272b1c01131b3292dc315
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned offline compiler and source packages
        run: |
          python -m pip install 'platformio==6.1.18'
          npm ci --prefix experiments/v08_protocol --ignore-scripts --no-audit --no-fund
      - name: Link equivalent guarded full legacy and native media candidates
        run: pio run -d experiments/v08_m7 -e legacy_compile -e media_compile
      - name: Execute public/synthetic real BearSSL and actual owner over loopback, no skips
        env:
          SHINO_ARDUINOJSON_SRC: experiments/v08_m7/.pio/libdeps/legacy_compile/ArduinoJson/src
          EXPECTED_HEAD: 84129daa7359c73e738272b1c01131b3292dc315
        run: |
          python tools/v08_m7_runner.py > "${{ runner.temp }}/v08-m7-host.json"
          python tools/v08_m7_resource.py > "${{ runner.temp }}/v08-m7-resource.json"
          python -c 'import json,os; h=json.load(open(os.environ["RUNNER_TEMP"]+"/v08-m7-host.json")); r=json.load(open(os.environ["RUNNER_TEMP"]+"/v08-m7-resource.json")); assert h["head"]==r["head"]==os.environ["EXPECTED_HEAD"] and not h["dirty"] and not r["dirty"]; assert len(h["runs"])==2 and all(x["result"]["failed"]==0 and x["result"]["live_descriptors"]==0 for x in h["runs"]); assert h["wire_differential"]["agreement"]'
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: v08-m7-native-evidence-historical-84129daa7359c73e738272b1c01131b3292dc315
          path: ${{ runner.temp }}/v08-m7-*.json
          if-no-files-found: error
  v08-m6c-r7-partial:
    name: V0.8 Mission 6C partial R7 and architecture blockers (loopback only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical 6C runner enforces its own mission diff. Retain it intact.
          ref: 4d6180959b843c64e92b72425134c2dfc6688c88
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact pinned source package
        run: |
          python -m pip install 'platformio==6.1.18'
          pio pkg install -g -t 'platformio/framework-arduinoespressif8266@3.30102.0'
      - uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: 77771d3c07668e01d8f52acb03910c1110bb373f
          path: reference-arduinojson
          persist-credentials: false
      - name: Execute six stock, previous and partial R7 compositions, no skips
        env:
          SHINO_ARDUINOJSON_SRC: ${{ runner.temp }}/reference-arduinojson/src
          EXPECTED_HEAD: 4d6180959b843c64e92b72425134c2dfc6688c88
        run: |
          test "$(git -C reference-arduinojson rev-parse HEAD)" = "77771d3c07668e01d8f52acb03910c1110bb373f"
          mv reference-arduinojson "${{ runner.temp }}/reference-arduinojson"
          python tools/v08_m6c_socket_runner.py > "${{ runner.temp }}/v08-m6c-evidence.json"
          python -c 'import json,os; e=json.load(open(os.environ["RUNNER_TEMP"]+"/v08-m6c-evidence.json")); assert e["source_head"] == os.environ["EXPECTED_HEAD"] and not e["working_tree_dirty"]; assert len(e["runs"])==6 and all(r["result"]["failed"]==0 and r["result"]["live_descriptors"]==0 for r in e["runs"])'
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: v08-m6c-r7-evidence-4d6180959b843c64e92b72425134c2dfc6688c88
          path: ${{ runner.temp }}/v08-m6c-evidence.json
          if-no-files-found: error
  v08-m6b-host-security:
    name: V0.8 Mission 6B corrected host security and unchanged wire differential (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The unchanged 6B evidence runner enforces its exact mission diff.
          # Re-run that historical head; 6C separately verifies its preservation.
          ref: 7d40df9f69bead1aa3a8c7ebd88dbfa0121968e0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install retained pinned Structured Fields dependency without lifecycle scripts
        run: npm ci --prefix experiments/v08_protocol --ignore-scripts --no-audit --no-fund
      - name: Execute corrected candidate and retain vulnerable provenance, with no skips
        run: |
          python tools/v08_m6b_evidence.py > "${{ runner.temp }}/v08-m6b-security-evidence.json"
          python -c 'import json, os; e=json.load(open(os.environ["RUNNER_TEMP"]+"/v08-m6b-security-evidence.json")); assert e["head"] == os.environ["EXPECTED_HEAD"] and e["working_tree_clean"]'
          git diff --exit-code
          test -z "$(git status --porcelain)"
        env:
          EXPECTED_HEAD: 7d40df9f69bead1aa3a8c7ebd88dbfa0121968e0
      - uses: actions/upload-artifact@v4
        with:
          name: v08-m6b-security-evidence-7d40df9f69bead1aa3a8c7ebd88dbfa0121968e0
          path: ${{ runner.temp }}/v08-m6b-security-evidence.json
          if-no-files-found: error
  v07-source-executed-ingress:
    name: V0.7 pinned-source C++ ingress lab (host only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact pinned ESP8266 Core package for source extraction
        run: |
          python -m pip install 'platformio==6.1.18'
          pio pkg install -g -t 'platformio/framework-arduinoespressif8266@3.30102.0'
      - name: Execute pinned parser and bounded candidate under host C++ compiler
        run: |
          python -c "from pathlib import Path; import sys; sys.path.insert(0, 'tools'); from v07_pinned_core_probe import pinned_sources; print('pinned files:', len(pinned_sources()))"
          python -m unittest discover -s tools -p 'test_v07_source_executed_lab.py' -v
          python tools/v07_full_parser_probe.py
          python tools/v07_cpp_lab_runner.py
          python tools/v07_cpp_lab_runner.py v07_single_owner_handoff_lab.cpp
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch independently pinned ArduinoJson 7.4.3 source for HOST comparison
        uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: 77771d3c07668e01d8f52acb03910c1110bb373f
          path: reference-arduinojson
          persist-credentials: false
      - name: Verify original FslessMetrics.cpp using REAL ArduinoJson on host (NO DEVICE)
        env:
          SHINO_ARDUINOJSON_SRC: reference-arduinojson/src
        run: |
          test "$(git -C reference-arduinojson rev-parse HEAD)" = "77771d3c07668e01d8f52acb03910c1110bb373f"
          python tools/verify_native_arduinojson_parity.py
      - name: Install pinned M9 source-audit packages (no serial execution)
        run: python -m pip install 'esptool==5.4.0' 'esp-pylib==1.1.5' 'pyserial==3.5' 'littlefs-python==0.15.0'

      - name: Test static firmware inspector
        env:
          SHINO_ARDUINOJSON_SRC: reference-arduinojson/src
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Test Windows telemetry bridge and bounded V0.5 host-only media emulation (no device)
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s companion -p 'test_*.py' -v
      - name: Test 240x240 scene renderer and isolated NOW PLAYING V0.3 preview
        run: node --test simulator/scene.test.mjs simulator/now_playing.test.mjs
      - name: Exercise exact PROGMEM UI V2 math and browser four-card states
        run: node --test tools/test_native_ui_v2.cjs
      - name: Check JS syntax (existing scene + V0.3 preview)
        run: |
          node --check simulator/scene.mjs
          node --check simulator/now_playing.mjs
          node --check simulator/now-playing-live.mjs

  v08-host-crypto-vectors:
    name: V0.8 fixed public crypto vectors (host only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed RFC 9421 profile vectors with real host P-256 crypto
        run: node --test tools/test_v08_crypto_lab.js

  v08-single-owner-preparse:
    name: V0.8 pinned parser handoff and isolated native link (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned research compiler packages
        run: |
          python -m pip install 'platformio==6.1.18'
          pio pkg install -g -t 'platformio/framework-arduinoespressif8266@3.30102.0'
      - name: Execute transformed pinned C++ preparse and legacy parser source
        run: python tools/v08_source_executed_preparse.py
      - name: Link baseline and disabled-by-default research variants
        run: pio run -d experiments/v08_preparse -e baseline_compile -e preparse_compile
      - name: Record exact head and linked size evidence
        run: |
          python tools/v08_native_size_report.py
          git rev-parse HEAD

  v08-full-bridge-qualification:
    name: V0.8 full bridge link and host protocol qualification (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned research packages without Node lifecycle scripts
        run: |
          python -m pip install 'platformio==6.1.18'
          npm ci --prefix experiments/v08_protocol --ignore-scripts --no-audit --no-fund
          pio pkg install -g -t 'platformio/framework-arduinoespressif8266@3.30102.0'
      - name: Retained public vectors and profile 1.1 interoperability
        run: node --test tools/test_v08_crypto_lab.js tools/test_v08_m3_profile.js tools/test_v08_m5_known_failures.js
      - name: Actual pinned parser path and Basic fallback branch
        run: |
          python tools/v08_m3_parser_lab.py
          python tools/v08_m3_basic_probe.py
      - name: Link equivalent unstarted full-bridge baseline and overlay experiment
        run: pio run -d experiments/v08_full_bridge -e bridge_baseline -e bridge_preparse
      - name: Actual unchanged bridge handlers with real ArduinoJson and inert dependencies
        run: python tools/v08_m3_bridge_runner.py
      - name: Mission 5 actual pinned socket parser dispatch auth and response composition (loopback only)
        run: |
          python tools/v08_m5_socket_runner.py > "${{ runner.temp }}/v08-m5-socket-evidence.json"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Preserve exact-head Mission 5 host measurements and source fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: v08-m5-socket-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/v08-m5-socket-evidence.json
          if-no-files-found: error
      - name: Linked size, compiler frame and exact-head provenance
        run: |
          python tools/v08_m3_resource_report.py
          git rev-parse HEAD
          git diff --exit-code -- firmware companion

      - name: Mission 6A stock previous corrected source and socket regressions (PC only)
        run: |
          python tools/v08_m6a_source_lab.py > "${{ runner.temp }}/v08-m6a-source-evidence.json"
          python tools/v08_m6a_socket_runner.py > "${{ runner.temp }}/v08-m6a-socket-evidence.json"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Mission 6A equivalent isolated native compile and static-memory comparison (no device)
        run: |
          pio run -d experiments/v08_m6a -e baseline_compile -e previous_compile -e corrected_compile
          python tools/v08_m6a_size_report.py > "${{ runner.temp }}/v08-m6a-native-size.json"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Preserve exact-head Mission 6A evidence
        uses: actions/upload-artifact@v4
        with:
          name: v08-m6a-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/v08-m6a-*.json
          if-no-files-found: error

  shino-link-windows-smoke:
    name: SHINO LINK Windows-only smoke (PC, no device)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise PC-only companion, config and tray imports (no network/device)
        run: |
          python -m pip install -r companion/requirements-link.txt
          python -m compileall -q companion/shino_link.py
          python -m unittest discover -s companion -p 'test_shino_link.py' -v
          python -c "import pystray; from PIL import Image; print('Windows tray imports OK')"
          python companion/shino_link.py --autostart status
      - name: Media session projection imports and mock PC-only probe (no live session/TV)
        run: |
          python -m pip install -r companion/requirements-media.txt
          python -m compileall -q companion/media_sessions.py
          python -m unittest discover -s companion -p 'test_media_sessions.py' -v
          python -m compileall -q companion/media_preview_server.py
          python -m unittest discover -s companion -p 'test_media_preview_server.py' -v
          python -m compileall -q companion/media_wire_v1.py
          python -m unittest discover -s companion -p 'test_media_wire_v1.py' -v
          python -m unittest discover -s companion -p 'test_media_auth_transfer.py' -v
          python -m unittest discover -s companion -p 'test_media_memory_lab.py' -v
          python -c "import winrt.windows.foundation; import winrt.windows.foundation.collections; import winrt.windows.media.control; import winrt.windows.storage.streams; print('All 4 WinRT projections OK')"
          python companion/media_sessions.py --demo
          python companion/media_sessions.py --probe
