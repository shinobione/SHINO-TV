name: Offline audit and simulator tests

on:
  push:
    branches: [main, 'planning/**', 'feature/**', 'safety/**']
  pull_request:

permissions:
  contents: read

jobs:
  v07-source-executed-ingress:
    name: V0.7 pinned-source C++ ingress lab (host only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact pinned ESP8266 Core package for source extraction
        run: |
          python -m pip install 'platformio==6.1.18'
          pio pkg install -g -t 'platformio/framework-arduinoespressif8266@3.30102.0'
      - name: Execute pinned parser and bounded candidate under host C++ compiler
        run: |
          python -c "from pathlib import Path; import sys; sys.path.insert(0, 'tools'); from v07_pinned_core_probe import pinned_sources; print('pinned files:', len(pinned_sources()))"
          python -m unittest discover -s tools -p 'test_v07_source_executed_lab.py' -v
          python tools/v07_full_parser_probe.py
          python tools/v07_cpp_lab_runner.py
          python tools/v07_cpp_lab_runner.py v07_single_owner_handoff_lab.cpp
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch independently pinned ArduinoJson 7.4.3 source for HOST comparison
        uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: 77771d3c07668e01d8f52acb03910c1110bb373f
          path: reference-arduinojson
          persist-credentials: false
      - name: Verify original FslessMetrics.cpp using REAL ArduinoJson on host (NO DEVICE)
        env:
          SHINO_ARDUINOJSON_SRC: reference-arduinojson/src
        run: |
          test "$(git -C reference-arduinojson rev-parse HEAD)" = "77771d3c07668e01d8f52acb03910c1110bb373f"
          python tools/verify_native_arduinojson_parity.py
      - name: Test static firmware inspector
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Test Windows telemetry bridge and bounded V0.5 host-only media emulation (no device)
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m unittest discover -s companion -p 'test_*.py' -v
      - name: Test 240x240 scene renderer and isolated NOW PLAYING V0.3 preview
        run: node --test simulator/scene.test.mjs simulator/now_playing.test.mjs
      - name: Exercise exact PROGMEM UI V2 math and browser four-card states
        run: node --test tools/test_native_ui_v2.cjs
      - name: Check JS syntax (existing scene + V0.3 preview)
        run: |
          node --check simulator/scene.mjs
          node --check simulator/now_playing.mjs
          node --check simulator/now-playing-live.mjs

  v08-host-crypto-vectors:
    name: V0.8 fixed public crypto vectors (host only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed RFC 9421 profile vectors with real host P-256 crypto
        run: node --test tools/test_v08_crypto_lab.js

  v08-single-owner-preparse:
    name: V0.8 pinned parser handoff and isolated native link (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned research compiler packages
        run: |
          python -m pip install 'platformio==6.1.18'
          pio pkg install -g -t 'platformio/framework-arduinoespressif8266@3.30102.0'
      - name: Execute transformed pinned C++ preparse and legacy parser source
        run: python tools/v08_source_executed_preparse.py
      - name: Link baseline and disabled-by-default research variants
        run: pio run -d experiments/v08_preparse -e baseline_compile -e preparse_compile
      - name: Record exact head and linked size evidence
        run: |
          python tools/v08_native_size_report.py
          git rev-parse HEAD

  v08-full-bridge-qualification:
    name: V0.8 full bridge link and host protocol qualification (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned research packages without Node lifecycle scripts
        run: |
          python -m pip install 'platformio==6.1.18'
          npm ci --prefix experiments/v08_protocol --ignore-scripts --no-audit --no-fund
          pio pkg install -g -t 'platformio/framework-arduinoespressif8266@3.30102.0'
      - name: Retained public vectors and profile 1.1 interoperability
        run: node --test tools/test_v08_crypto_lab.js tools/test_v08_m3_profile.js
      - name: Actual pinned parser path and Basic fallback branch
        run: |
          python tools/v08_m3_parser_lab.py
          python tools/v08_m3_basic_probe.py
      - name: Link equivalent unstarted full-bridge baseline and overlay experiment
        run: pio run -d experiments/v08_full_bridge -e bridge_baseline -e bridge_preparse
      - name: Actual unchanged bridge handlers with real ArduinoJson and inert dependencies
        run: python tools/v08_m3_bridge_runner.py
      - name: Linked size, compiler frame and exact-head provenance
        run: |
          python tools/v08_m3_resource_report.py
          git rev-parse HEAD
          git diff --exit-code -- firmware companion

  shino-link-windows-smoke:
    name: SHINO LINK Windows-only smoke (PC, no device)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise PC-only companion, config and tray imports (no network/device)
        run: |
          python -m pip install -r companion/requirements-link.txt
          python -m compileall -q companion/shino_link.py
          python -m unittest discover -s companion -p 'test_shino_link.py' -v
          python -c "import pystray; from PIL import Image; print('Windows tray imports OK')"
          python companion/shino_link.py --autostart status
      - name: Media session projection imports and mock PC-only probe (no live session/TV)
        run: |
          python -m pip install -r companion/requirements-media.txt
          python -m compileall -q companion/media_sessions.py
          python -m unittest discover -s companion -p 'test_media_sessions.py' -v
          python -m compileall -q companion/media_preview_server.py
          python -m unittest discover -s companion -p 'test_media_preview_server.py' -v
          python -m compileall -q companion/media_wire_v1.py
          python -m unittest discover -s companion -p 'test_media_wire_v1.py' -v
          python -m unittest discover -s companion -p 'test_media_auth_transfer.py' -v
          python -m unittest discover -s companion -p 'test_media_memory_lab.py' -v
          python -c "import winrt.windows.foundation; import winrt.windows.foundation.collections; import winrt.windows.media.control; import winrt.windows.storage.streams; print('All 4 WinRT projections OK')"
          python companion/media_sessions.py --demo
          python companion/media_sessions.py --probe
