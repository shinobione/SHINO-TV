[platformio]
; Keep the ordinary default unchanged when a second offline-only build profile exists.
default_envs = esp12e

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: lib deps, extra storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
; OTA core safety: freeze exact tested PlatformIO platform and Arduino core.
; Do not upgrade without re-auditing Updater.cpp signature/eboot semantics.
platform = espressif8266@4.2.1
platform_packages =
    platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 4MB
; FS-less first-boot app: align Arduino OTA boundary with observed OEM 3-MiB
; files area, rather than staging future U_FLASH images inside stock files.
; This is a linker/OTA layout, NOT authorization to mount or format LittleFS.
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = littlefs
monitor_filters = esp8266_exception_decoder, time, colorize
build_flags = 
	-Iinclude
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
extra_scripts = pre:scripts/git_version.py
check_tool = clangtidy
check_flags = 
	clangtidy: --checks=-*,bugprone-*,modernize-*,readability-*,modernize-use-trailing-return-type,-bugprone-easily-swappable-parameters --warnings-as-errors=*
lib_deps = 
	bblanchon/ArduinoJson@7.4.3
	moononournation/GFX Library for Arduino@^1.6.4
	bitbank2/AnimatedGIF@^2.2.0

; Opt-in compile-only diagnostic candidate. Never an upload or default image.
; Same pinned board/core/libs/linker; the ONLY extra flag exposes a read-only
; sampled heap summary on the existing authenticated GET /status route.
[env:esp12e_heap_diagnostics]
extends = env:esp12e
build_flags =
    ${env:esp12e.build_flags}
    -DSHINO_ENABLE_HEAP_DIAGNOSTICS=1

; Mission 9 — SHINO Flash Layout Liberation.
; OFFLINE/COMPILE-ONLY candidate: preserve the deployed/default 4m3m profile
; while qualifying the standard ESP8266 4m2m geometry. Selecting this
; environment is not authorization to upload, erase, migrate, mount or format
; the owner's device/filesystem.
[env:esp12e_m9_4m2m]
extends = env:esp12e
board_build.ldscript = eagle.flash.4m2m.ld

; Phase H: application-only OFFLINE mount probe. Never upload or buildfs here.
[env:esp12e_m9_4m2m_mount_probe]
extends = env:esp12e_m9_4m2m
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
build_flags =
    ${env:esp12e.build_flags}
    -DSHINO_BOOT_PROFILE=2
    -DSHINO_M9_MOUNT_PROBE=1
    -fstack-usage
extra_scripts =
    ${env:esp12e.extra_scripts}
    pre:scripts/m9_mount_probe_gate.py

; Phase J: separate OFFLINE resource observer. Existing probe flags unchanged.
[env:esp12e_m9_4m2m_mount_probe_resources]
extends = env:esp12e_m9_4m2m_mount_probe
build_flags =
    ${env:esp12e_m9_4m2m_mount_probe.build_flags}
    -DSHINO_M9_MOUNT_PROBE_RESOURCE_DIAGNOSTICS=1
