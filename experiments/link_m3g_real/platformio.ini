[platformio]
default_envs = deps_for_host

[env:deps_for_host]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@7.4.3
; Used only to DOWNLOAD pinned ArduinoJson headers for HOST unit execution.
; This environment is not used to build or upload any ESP8266 firmware.
