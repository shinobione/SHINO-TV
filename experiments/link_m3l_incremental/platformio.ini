[platformio]
default_envs = m3l_original, m3l_member_scratch, m3l_incremental

[env]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
  -I../../firmware/include
  -fstack-usage
  -DM3J_INERT_ENABLE_GATE=1

[env:m3l_original]
build_flags =
  ${env.build_flags}
  -DSHINO_M3C_STACK_MEMBER_SCRATCH=0
  -DSHINO_M3C_INCREMENTAL_HMAC=0

[env:m3l_member_scratch]
build_flags =
  ${env.build_flags}
  -DSHINO_M3C_STACK_MEMBER_SCRATCH=1
  -DSHINO_M3C_INCREMENTAL_HMAC=0

[env:m3l_incremental]
build_flags =
  ${env.build_flags}
  -DSHINO_M3C_STACK_MEMBER_SCRATCH=0
  -DSHINO_M3C_INCREMENTAL_HMAC=1
