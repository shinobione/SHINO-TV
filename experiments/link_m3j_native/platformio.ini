[platformio]
default_envs = m3j_inert_baseline, m3j_inert_m3_gate

[env]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
  -I../../firmware/include
  -fstack-usage

[env:m3j_inert_baseline]
build_flags =
  ${env.build_flags}
  -DM3J_INERT_ENABLE_GATE=0

[env:m3j_inert_m3_gate]
build_flags =
  ${env.build_flags}
  -DM3J_INERT_ENABLE_GATE=1
