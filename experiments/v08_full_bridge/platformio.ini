[platformio]
; Isolated compile/link project. Neither image starts the bridge.
default_envs = bridge_baseline
src_dir = .pio/shadow/src
include_dir = .pio/shadow/include
lib_dir = .pio/shadow/lib

[env:bridge_baseline]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m3m.ld
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -fstack-usage
extra_scripts = pre:prepare_shadow.py
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    moononournation/GFX Library for Arduino@1.6.4
    bitbank2/AnimatedGIF@2.2.0

[env:bridge_preparse]
extends = env:bridge_baseline
build_flags =
    ${env:bridge_baseline.build_flags}
    -DSHINO_V08_PREPARSE_EXPERIMENT=1
