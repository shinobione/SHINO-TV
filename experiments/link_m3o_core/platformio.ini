[platformio]
default_envs = core_baseline, core_hook_inert
[env]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
  -I../../firmware/include
  -fstack-usage
[env:core_baseline]
build_flags =
  ${env.build_flags}
  -DM3O_HOOK_GRAPH=0
[env:core_hook_inert]
build_flags =
  ${env.build_flags}
  -DM3O_HOOK_GRAPH=1
