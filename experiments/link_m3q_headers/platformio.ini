[platformio]
default_envs = m3p_only_inert, m3q_headers_inert
[env]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
  -I../../firmware/include
  -I../link_m3p_parser
  -I.
  -fstack-usage
lib_extra_dirs = .pio/m3q-venv
extra_scripts = pre:use_pinned_overlay.py
[env:m3p_only_inert]
build_flags =
  ${env.build_flags}
  -DSHINO_M3Q_HEADERS=0
[env:m3q_headers_inert]
build_flags =
  ${env.build_flags}
  -DSHINO_M3Q_HEADERS=1
