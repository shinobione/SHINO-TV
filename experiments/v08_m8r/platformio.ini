[platformio]
; Public graphs are guarded. qualification_compile is an active private build.
default_envs = legacy_compile
src_dir = .pio/shadow/src
include_dir = .pio/shadow/include
lib_dir = .pio/shadow/lib

[env:legacy_compile]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m3m.ld
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -DSHINO_V08_PREPARSE_EXPERIMENT=1
    -fstack-usage
extra_scripts = pre:prepare_shadow.py
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    moononournation/GFX Library for Arduino@1.6.4
    bitbank2/AnimatedGIF@2.2.0

[env:media_compile]
extends = env:legacy_compile
build_flags =
    ${env:legacy_compile.build_flags}
    -DLAB_M7_LINK=1

; Sensitivity measurement only. This does NOT establish a supported larger
; SYS-stack reservation and is never an install profile or the chosen remedy.
[env:stack_sensitivity_compile]
extends = env:media_compile
build_flags =
    ${env:media_compile.build_flags}
    -DCONT_STACKSIZE=6144

; Active bounded qualification graph; private policy must be provided locally.
; This environment is not an upload command. CI never receives private files.
[env:qualification_compile]
extends = env:media_compile
build_flags =
    ${env:media_compile.build_flags}
    -DSHINO_ENABLE_HEAP_DIAGNOSTICS=1
    -DSHINO_M8_PRIVATE_INSTALL=1
