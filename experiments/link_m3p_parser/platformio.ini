[platformio]
default_envs = unpatched_core_control, bounded_core_inert
[env]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
  -I../../firmware/include
  -I.
  -fstack-usage
[env:unpatched_core_control]
build_flags =
  ${env.build_flags}
  -DSHINO_M3P_BOUNDED=0
[env:bounded_core_inert]
build_flags =
  ${env.build_flags}
  -DSHINO_M3P_BOUNDED=1
lib_extra_dirs = .pio/m3p-venv
extra_scripts = pre:use_pinned_overlay.py
