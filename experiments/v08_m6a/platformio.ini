[platformio]
; Compile/link only. No upload task or device runtime is part of this lab.
default_envs = baseline_compile

[env:baseline_compile]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m3m.ld

[env:previous_compile]
extends = env:baseline_compile
build_flags = -DSHINO_V08_PREPARSE_EXPERIMENT=1 -DLAB_PREVIOUS=1
extra_scripts = pre:prepare_overlay.py

[env:corrected_compile]
extends = env:baseline_compile
build_flags = -DSHINO_V08_PREPARSE_EXPERIMENT=1
extra_scripts = pre:prepare_overlay.py
