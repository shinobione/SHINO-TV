[platformio]
default_envs = m3r_inert_single_parser

[env:m3r_inert_single_parser]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
lib_extra_dirs = .pio/m3r-venv
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
  -DSHINO_M3C_INCREMENTAL_HMAC=1
  -DSHINO_M3C_STACK_MEMBER_SCRATCH=0
  -I../../firmware/include
  -I../link_m3p_parser
  -fstack-usage
extra_scripts = pre:use_pinned_overlay.py
