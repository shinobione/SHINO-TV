[platformio]
default_envs = inert_baseline

[env]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
build_flags =
  -I../../firmware/include
  -DSHINO_ENABLE_FACTORY_RESTORE=0
  -DSHINO_ENABLE_NATIVE_SIGNED_OTA=0
  -DM9_SIGNED_OTA_UNWIRED=1
  -fstack-usage
extra_scripts = pre:guard.py

[env:inert_baseline]

[env:signed_compile_only]
build_flags =
  ${env.build_flags}
  -DM9_SIGNED_COMPILE_PROOF=1
