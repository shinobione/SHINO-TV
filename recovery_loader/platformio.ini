; SHINO // TV — minimal, separate ESP8266 Wi-Fi trampoline.
; Compile only. DO NOT upload this binary to owner hardware.
[env:esp12e_recovery]
platform = espressif8266
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D HTTP_MAX_POST_WAIT=10000
monitor_speed = 115200
