; SHINO // TV — minimal, separate ESP8266 Wi-Fi trampoline.
; Compile only. DO NOT upload this binary to owner hardware.
[env:esp12e_recovery]
; OTA core safety: freeze exact tested PlatformIO platform and Arduino core.
; Do not upgrade without re-auditing Updater.cpp signature/eboot semantics.
platform = espressif8266@4.2.1
platform_packages =
    platformio/framework-arduinoespressif8266@3.30102.0
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D HTTP_MAX_POST_WAIT=10000
monitor_speed = 115200
